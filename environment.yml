name: fvab-basket

channels:
  - conda-forge

dependencies:
  - python=3.10
  - pip

  # Core scientific stack
  - numpy
  - pandas
  - scipy
  - scikit-learn

  # Visualization and notebook support
  - matplotlib
  - seaborn
  - ipykernel

  # Image/video utilities
  # OpenCV is installed from pip as opencv-python to avoid mixing the
  # conda package "opencv" with the package required by Ultralytics.
  - pillow
  - ffmpeg

  # Configuration and progress reporting
  - pyyaml
  - tqdm

  - pip:
      # Deep learning
      - torch
      - torchvision

      # Computer vision
      - opencv-python
      - ultralytics